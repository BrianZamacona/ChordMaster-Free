name: chordmaster_free
description: Learn & Strum, a free offline guitar-learning app (chords, scales, progressions, tuner and ear training).
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  hive_flutter: 1.1.0
  hive: 2.2.3
  just_audio: 0.10.6
  record: 7.1.1
  permission_handler: 12.0.3
  flutter_local_notifications: 22.0.1
  url_launcher: 6.3.2
  go_router: 17.3.0
  google_fonts: 8.1.0
  flutter_secure_storage: 10.3.1
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/google_fonts/
  