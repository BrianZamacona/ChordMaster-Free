name: chordmaster_free
description: Learn & Strum, a free offline guitar-learning app (chords, scales, progressions, tuner and ear training).
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  hive_flutter: 1.1.0
  hive: 2.2.3
  just_audio: 0.10.6
  record: 7.1.2
  permission_handler: 13.0.2
  flutter_local_notifications: 22.3.3
  url_launcher: 6.3.3
  go_router: 18.1.2
  google_fonts: 9.0.0
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/google_fonts/
  